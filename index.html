<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>商品價格查詢</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
    }

    #result {
      margin-top: 24px;
      padding: 16px;
      background: #f8f8f8;
      border-radius: 10px;
      min-height: 50px;
    }

    .barcode {
      color: #777;
      font-size: 14px;
    }

    .product-name {
      font-size: 22px;
      font-weight: bold;
      margin-top: 8px;
    }

    .price {
      font-size: 30px;
      font-weight: bold;
      margin-top: 8px;
    }

    .hint {
      text-align: center;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>商品價格查詢</h1>

  <div id="reader"></div>

  <p class="hint">
    點擊下方按鈕後，允許使用相機即可掃描商品條碼
  </p>

  <div>
    <input
      type="text"
      id="barcodeInput"
      placeholder="也可以手動輸入條碼"
      inputmode="numeric"
    >

    <button onclick="manualSearch()">
      手動查詢
    </button>
  </div>

  <div id="result">
    尚未查詢商品
  </div>

</div>

<script>

let scanner = null;
let scanning = false;

function startScanner() {

  if (scanning) return;

  scanner = new Html5Qrcode("reader");

  scanner.start(
    {
      facingMode: "environment"
    },
    {
      fps: 10,
      qrbox: {
        width: 280,
        height: 160
      }
    },
    function(decodedText) {

      document.getElementById("barcodeInput").value =
        decodedText;

      showBarcode(decodedText);

      scanner.stop().then(function() {
        scanning = false;
      }).catch(function() {
        scanning = false;
      });

    },
    function(errorMessage) {
      // 掃不到時不顯示錯誤
    }

  ).then(function() {

    scanning = true;

  }).catch(function(error) {

    document.getElementById("result").innerHTML =
      "❌ 相機啟動失敗";

    console.log(error);

  });
}


function showBarcode(barcode) {

  document.getElementById("result").innerHTML =
    '<div class="barcode">掃描到的條碼</div>' +
    '<div class="product-name">' +
    barcode +
    '</div>' +
    '<br>' +
    '目前先測試掃描功能。';
}


function manualSearch() {

  const barcode =
    document.getElementById("barcodeInput").value.trim();

  if (!barcode) {

    document.getElementById("result").innerHTML =
      "請輸入條碼";

    return;
  }

  showBarcode(barcode);
}


document.addEventListener(
  "DOMContentLoaded",
  function() {

    const reader =
      document.getElementById("reader");

    const button =
      document.createElement("button");

    button.textContent =
      "📷 開啟相機掃描";

    button.onclick =
      startScanner;

    reader.parentNode.insertBefore(
      button,
      reader
    );

  }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>商品價格查詢</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      font-size: 26px;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    .input-area {
      margin-top: 20px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    #result {
      margin-top: 24px;
      padding: 16px;
      background: #f8f8f8;
      border-radius: 10px;
      min-height: 50px;
    }

    .barcode {
      color: #777;
      font-size: 14px;
    }

    .product-name {
      font-size: 22px;
      font-weight: bold;
      margin-top: 8px;
    }

    .price {
      font-size: 30px;
      font-weight: bold;
      margin-top: 8px;
    }

    .hint {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>商品價格查詢</h1>

    <div id="reader"></div>

    <p class="hint">
      掃描商品條碼或手動輸入條碼
    </p>

    <div class="input-area">

      <input
        type="text"
        id="barcodeInput"
        placeholder="請輸入商品條碼"
        inputmode="numeric"
      >

      <button onclick="manualSearch()">
        查詢價格
      </button>

    </div>

    <div id="result">
      尚未查詢商品
    </div>

  </div>

  <script>

    // ⭐ 你的 Google Apps Script 網址
    const API_URL =
      "https://script.google.com/macros/s/AKfycbxCrtLEC2i2wS5x4ju8Bhcb37W2ef20D1makHm4caqKOxfwODa_G1DcfnMS3X6WORUObg/exec";

    let scanner = null;
    let scanning = false;

    // =========================
    // 開啟相機
    // =========================

    function startScanner() {

      if (scanning) return;

      scanner = new Html5Qrcode("reader");

      scanner.start(
        {
          facingMode: "environment"
        },
        {
          fps: 10,
          qrbox: {
            width: 280,
            height: 160
          }
        },
        function(decodedText) {

          document.getElementById("barcodeInput").value =
            decodedText;

          searchProduct(decodedText);

          scanner.stop().then(function() {
            scanning = false;
          }).catch(function() {
            scanning = false;
          });

        },
        function(errorMessage) {
          // 掃不到時不顯示錯誤
        }

      ).then(function() {

        scanning = true;

      }).catch(function(error) {

        document.getElementById("result").innerHTML =
          "❌ 相機啟動失敗<br><br>" +
          "請確認已允許瀏覽器使用相機。";

        console.log(error);

      });
    }


    // =========================
    // 手動查詢
    // =========================

    function manualSearch() {

      const barcode =
        document.getElementById("barcodeInput").value.trim();

      if (!barcode) {

        document.getElementById("result").innerHTML =
          "請輸入條碼";

        return;
      }

      searchProduct(barcode);
    }


    // =========================
    // 查詢 Google Sheet
    // =========================

    function searchProduct(barcode) {

      document.getElementById("result").innerHTML =
        "🔍 查詢商品中...";

      const callbackName =
        "callback_" + Date.now();

      window[callbackName] = function(data) {

        if (data.found) {

          document.getElementById("result").innerHTML =
            '<div class="barcode">條碼：' +
            barcode +
            '</div>' +

            '<div class="product-name">' +
            data.name +
            '</div>' +

            '<div class="price">$' +
            data.price +
            '</div>';

        } else {

          document.getElementById("result").innerHTML =
            '<div class="barcode">條碼：' +
            barcode +
            '</div><br>' +
            '❌ 找不到這個商品';

        }

        delete window[callbackName];
        script.remove();
      };


      const script =
        document.createElement("script");

      script.src =
        API_URL +
        "?barcode=" +
        encodeURIComponent(barcode) +
        "&callback=" +
        callbackName;

      script.onerror = function() {

        document.getElementById("result").innerHTML =
          "❌ 無法連接商品資料庫";

        delete window[callbackName];
        script.remove();
      };

      document.body.appendChild(script);
    }


    // =========================
    // 建立掃描按鈕
    // =========================

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        const reader =
          document.getElementById("reader");

        const button =
          document.createElement("button");

        button.textContent =
          "📷 開啟相機掃描";

        button.onclick =
          startScanner;

        reader.parentNode.insertBefore(
          button,
          reader
        );

      }
    );

  </script>

</body>
</html>

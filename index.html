<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>商品價格查詢</title>

  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 10px;
      background: black;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      margin-bottom: 10px;
    }

    button:active {
      opacity: 0.8;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 10px;
    }

    #result {
      margin-top: 20px;
      padding: 16px;
      background: #f5f5f5;
      border-radius: 10px;
      min-height: 50px;
    }

    .barcode {
      color: #777;
      font-size: 14px;
    }

    .product-name {
      font-size: 22px;
      font-weight: bold;
      margin-top: 8px;
    }

    .price {
      font-size: 30px;
      font-weight: bold;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>商品價格查詢</h1>

  <button onclick="startScanner()">
    📷 開始掃描
  </button>

  <video id="video" autoplay muted playsinline></video>

  <input
    type="text"
    id="barcodeInput"
    placeholder="也可以手動輸入條碼"
    inputmode="numeric"
  >

  <button onclick="manualSearch()">
    🔍 查詢價格
  </button>

  <div id="result">
    尚未查詢商品
  </div>

</div>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbxCrtLEC2i2wS5x4ju8Bhcb37W2ef20D1makHm4caqKOxfwODa_G1DcfnMS3X6WORUObg/exec";

let codeReader = null;
let scanning = false;


// ==========================
// 開始掃描
// ==========================

function startScanner() {

  if (scanning) return;

  document.getElementById("result").innerText =
    "正在啟動相機...";

  codeReader =
    new ZXingBrowser.BrowserMultiFormatReader();

  codeReader.decodeFromConstraints(
    {
      video: {
        facingMode: {
          ideal: "environment"
        }
      },
      audio: false
    },
    "video",
    (result, error) => {

      if (result) {

        const barcode = result.getText();

        scanning = false;

        document.getElementById("barcodeInput").value =
          barcode;

        document.getElementById("result").innerText =
          "🔍 查詢商品中...";

        codeReader.reset();

        searchProduct(barcode);
      }

    }

  ).then(() => {

    scanning = true;

    document.getElementById("result").innerText =
      "📷 相機已啟動，請將條碼對準鏡頭";

  }).catch(error => {

    console.log(error);

    document.getElementById("result").innerText =
      "❌ 相機無法啟動";

  });
}


// ==========================
// 手動查詢
// ==========================

function manualSearch() {

  const barcode =
    document.getElementById("barcodeInput").value.trim();

  if (!barcode) {

    document.getElementById("result").innerText =
      "請輸入條碼";

    return;
  }

  searchProduct(barcode);
}


// ==========================
// 查詢 Google Sheet
// ==========================

function searchProduct(barcode) {

  document.getElementById("result").innerText =
    "🔍 查詢商品中...";


  const callbackName =
    "callback_" + Date.now();


  window[callbackName] = function(data) {

    if (data.found) {

      document.getElementById("result").innerHTML =

        '<div class="barcode">' +
        '條碼：' + barcode +
        '</div>' +

        '<div class="product-name">' +
        data.name +
        '</div>' +

        '<div class="price">' +
        '$' + data.price +
        '</div>';

    } else {

      document.getElementById("result").innerHTML =

        '<div class="barcode">' +
        '條碼：' + barcode +
        '</div><br>' +

        '❌ 找不到這個商品';

    }

    delete window[callbackName];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }
  };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?barcode=" +
    encodeURIComponent(barcode) +
    "&callback=" +
    callbackName;


  script.onerror = function() {

    document.getElementById("result").innerText =
      "❌ 無法連接商品資料庫";

    delete window[callbackName];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }
  };


  document.body.appendChild(script);
}

</script>

</body>
</html>

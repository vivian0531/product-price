<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>商品價格查詢</title>

  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
    }

    h1 {
      text-align: center;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 10px;
      background: black;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      margin-bottom: 10px;
    }

    #result {
      margin-top: 20px;
      padding: 16px;
      background: #f5f5f5;
      border-radius: 10px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>商品價格查詢</h1>

  <button onclick="startScanner()">
    📷 開始掃描
  </button>

  <video id="video" autoplay muted playsinline></video>

  <div id="result">
    尚未掃描
  </div>

</div>

<script>

let codeReader = null;
let scanning = false;

function startScanner() {

  if (scanning) return;

  document.getElementById("result").innerText =
    "正在啟動相機...";

  codeReader =
    new ZXingBrowser.BrowserMultiFormatReader();

  codeReader.decodeFromConstraints(
    {
      video: {
        facingMode: {
          ideal: "environment"
        }
      },
      audio: false
    },
    "video",
    (result, error) => {

      if (result) {

        scanning = false;

        document.getElementById("result").innerText =
          "掃描成功！條碼：" +
          result.getText();

        codeReader.reset();
      }

    }

  ).then(() => {

    scanning = true;

    document.getElementById("result").innerText =
      "📷 相機已啟動，請將條碼對準框內";

  }).catch(error => {

    console.log(error);

    document.getElementById("result").innerText =
      "❌ 相機無法啟動";

  });
}

</script>

</body>
</html>
